[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suppresskit"
version = "0.1.0"
description = "Small-cell suppression, rounding and k-anonymity checks for publishing aggregate health data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rob Warren" }]
keywords = ["statistical disclosure control", "small cell suppression", "k-anonymity", "public health", "privacy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "mypy>=1.5", "ruff>=0.4", "pandas-stubs"]

[project.scripts]
suppresskit = "suppresskit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
ignore_missing_imports = true
